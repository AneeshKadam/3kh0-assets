
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading game...</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <iframe id="game" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
          allowfullscreen></iframe>

  <script>
    const params = new URLSearchParams(location.search);
    const gamePath = params.get("game");

    // Only allow games inside truffled/html.
    if (!gamePath || !/^truffled\/html\/[\w.-]+\.html$/.test(gamePath)) {
      document.body.textContent = "Invalid game URL.";
    } else {
      document.title = "Game";
      document.getElementById("game").src = gamePath;
    }
  </script>
</body>
</html>
