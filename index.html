        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        /* 8-Column Grid Layout using Pure CSS */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr); /* Exactly 8 items per row */
            gap: 12px;
            max-width: 1400px;
            margin: 40px auto;
            padding: 10px;
        }

        /* Screen Adjustment for smaller devices */
        @media (max-width: 1200px) { .game-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 768px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }

        /* Pure HTML Link Styling to look like game cards */
        .game-card {
            position: relative;
  width: 150px;
  height: 150px;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 0.3s ease;
  cursor: pointer;
  background: #222;
        }
        .game-card::before {
  content: '';
  position: absolute;
  width: 150%;
  height: 150%;
  background: conic-gradient(
    #2E2467, /* Blue */
    #5D6532, /* Cyan */
    #FFFFFF, /* Purple */
    #C0C0C0  /* Blue loop */
  );
  
  /* HIDE THE EFFECT BY DEFAULT */
  opacity: 0;
  transition: opacity 0.3s ease;
}

/* 3. TARGETED HOVER STATE: Turn on the visibility and spin the animation */
.game-card:hover::before {
  opacity: 1;
  animation: spin 2.5s linear infinite; /* Starts spinning ONLY on hover */
}

/* Zoom the whole card slightly on hover */
.game-card:hover {
  transform: scale(1.05);
}
.card-inner {
  position: absolute;
  inset: 3px; /* This dictates the line thickness (3px wide) */
  background: #121214; /* Match this to your web page's dark background */
  border-radius: 9px;
  overflow: hidden;
  z-index: 1;
}

.card-inner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 5. The outward under-glow (Hidden by default) */
.game-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 12px;
  box-shadow: 0 0 0px transparent;
  transition: box-shadow 0.3s ease;
  z-index: 2;
  pointer-events: none;
}

/* TARGETED HOVER STATE: Turn on the soft outward blur glow */
.game-card:hover::after {
  box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); 
}
        @keyframes spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
        .game-card:hover {transform: scale(1.05); }
        .game-img {
            width:178px;
            height:142px;
            border-radius:12px;
        }
        #jumpscare-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        /* Handles the violent flashing/shaking during the prank */
        .active-prank {
            animation: flashScreen 0.1s infinite alternate;
        }

        .jumpscare-text {
            color: black;
            background-color: white;
            font-size: 4rem;
            padding: 10px 30px;
            transform: rotate(-5deg); 
            box-shadow: 10px 10px 0px black;
            margin: 10px;
            text-transform: uppercase;
        }

        .sub-text {
            color: white;
            background-color: black;
            font-size: 2.5rem;
            transform: rotate(3deg);
            box-shadow: -10px 10px 0px white;
        }

        /* THE ESCAPE BUTTON */
        #escape-btn {
            display: none;
            margin-top: 30px;
            font-size: 1.5rem;
            padding: 15px 30px;
            background-color: white;
            color: black;
            border: 4px solid black;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            box-shadow: 5px 5px 0px #dc0000;
            text-transform: uppercase;
            z-index: 10000;
        }

        #escape-btn:hover {
            background-color: #dc0000;
            color: white;
            box-shadow: 5px 5px 0px black;
        }

        @keyframes flashScreen {
            0% { background-color: #dc0000; transform: translate(2px, 1px) rotate(0deg); }
            100% { background-color: #000000; transform: translate(-1px, -2px) rotate(1deg); }
        }

<audio id="ragebait-audio" src="ragebait.mp3"></audio>

<script>
  var prankTimer;

  function triggerJumpscare() {
    var overlay = document.getElementById('jumpscare-overlay');
    var audio = document.getElementById('ragebait-audio');
    var escapeBtn = document.getElementById('escape-btn');

    // show overlay and enable animation
    overlay.style.display = 'flex';
    overlay.classList.add('active-prank');

    // play audio if available
    audio.currentTime = 0;
    audio.play().catch(function(e){ /* autoplay blocked or missing file */ });

    // after 35s stop flashing and show escape
    prankTimer = setTimeout(function() {
      overlay.classList.remove('active-prank');
      overlay.style.backgroundColor = '#121212';
      escapeBtn.style.display = 'block';
    }, 35000);
  }

  function closePrank() {
    var overlay = document.getElementById('jumpscare-overlay');
    var escapeBtn = document.getElementById('escape-btn');
    var audio = document.getElementById('ragebait-audio');

    // stop and cleanup
    audio.pause();
    audio.currentTime = 0;
    clearTimeout(prankTimer);

    // hide overlay and stop animation
    overlay.classList.remove('active-prank');
    overlay.style.display = 'none';
    escapeBtn.style.display = 'none';
  }
</script>
