<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Massive 8-Column Arcade</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        /* Strict 8-Column Grid Layout */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr); /* Exactly 8 games per row */
            gap: 12px;
            max-width: 1400px;
            margin: 20px auto;
            padding: 10px;
        }

        /* Responsive scaling for laptops, tablets, and phones */
        @media (max-width: 1200px) { .game-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 768px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }

        .game-card {
            background: #222;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px 5px;
            cursor: pointer;
            text-transform: capitalize;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: 0.2s;
        }
        .game-card:hover { background: #007bff; border-color: #00c6ff; transform: scale(1.05); }

        /* Virtual Console/Theater View Overlay */
        .theater { display: none; margin: 20px auto; max-width: 900px; }
        iframe { width: 100%; height: 550px; border: 4px solid #333; border-radius: 8px; background: #000; }
        .close-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎮 Massive HTML5 Arcade 🕹️</h1>
    <p>Click a box below to load the game instantly</p>

    <!-- Game Player Viewport -->
    <div class="theater" id="theater">
        <button class="close-btn" onclick="closeGame()">Close Game ✕</button>
        <iframe id="player" allowfullscreen></iframe>
    </div>

    <!-- 8-Column Grid -->
    <div class="game-grid" id="grid"></div>

    <script>
        // A hardcoded array of the top 3kh0 repository games.
        // This completely bypasses GitHub's API limits so your site never breaks.
        const popularGames = [
            "slope", "retro-bowl", "drive-mad", "idle-breakout", "cookie-clicker", 
            "geometry-dash", "1v1lol", "crossyroad", "bitlife", "subway-surfers", 
            "tetris", "tunnel-rush", "run-3", "snow-rider-3d", "tanuki-sunset",
            "minecraft-classic", "happy-wheels", "ovo", "papalouie", "cluster-rush",
            "pacman", "sonic-rems", "basket-random", "soccer-random", "temple-run-2",
            "binding-of-isaac", "smash-karts", "world-worlds-hardest-game", "drift-hunters",
            "slope-2", "vex-7", "stickman-hook", "getaway-shootout", "rooftop-snipers"
        ];

        function initArcade() {
            const grid = document.getElementById('grid');
            
            popularGames.forEach(gameName => {
                const card = document.createElement('div');
                card.className = 'game-card';
                // Automatically replaces hyphens with spaces for a clean button label
                card.innerText = gameName.replace(/-/g, ' '); 
                card.onclick = () => playGame(gameName);
                grid.appendChild(card);
            });
        }

        function playGame(folderName) {
            document.getElementById('player').src = `${folderName}/index.html`;
            document.getElementById('theater').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll up smoothly to play
        }

        function closeGame() {
            document.getElementById('theater').style.display = 'none';
            document.getElementById('player').src = '';
        }

        // Boot arcade catalog layout immediately
        initArcade();
    </script>
</body>
</html>
