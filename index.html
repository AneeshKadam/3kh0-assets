    <meta charset="UTF-8">

    <title>My Pure HTML 8-Column Arcade</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        /* 8-Column Grid Layout using Pure CSS */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr); /* Exactly 8 items per row */
            gap: 12px;
            max-width: 1400px;
            margin: 40px auto;
            padding: 10px;
        }

        /* Screen Adjustment for smaller devices */
        @media (max-width: 1200px) { .game-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 768px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }

        /* Pure HTML Link Styling to look like game cards */
        .game-card {
            background: #222;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px 5px;
            text-transform: capitalize;
            font-size: 14px;
            color: #fff;
            text-decoration: none; /* Removes the underline from links */
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: 0.2s;
        }
        .game-card:hover { background: #007bff; border-color: #00c6ff; transform: scale(1.05); }
    </style>
</head>
