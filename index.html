<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Instant 8-Column Arcade</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        /* 8-Column Grid Layout */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr); /* Exactly 8 items per row */
            gap: 12px;
            max-width: 1400px;
            margin: 20px auto;
            padding: 10px;
        }

        /* Screen Adjustment for smaller displays */
        @media (max-width: 1200px) { .game-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }

        .game-card {
            background: #222;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 15px 5px;
            cursor: pointer;
            text-transform: capitalize;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: 0.2s;
        }
        .game-card:hover { background: #007bff; border-color: #00c6ff; transform: scale(1.05); }

        /* Theater Screen Overlay */
        .theater { display: none; margin: 20px auto; max-width: 900px; }
        iframe { width: 100%; height: 550px; border: 4px solid #333; border-radius: 8px; background: #000; }
        .close-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎮 Massive HTML5 Arcade 🕹️</h1>
    <p>Click a box below to load the game instantly</p>

    <!-- Game Player Section -->
    <div class="theater" id="theater">
        <button class="close-btn" onclick="closeGame()">Close Game ✕</button>
        <iframe id="player" allowfullscreen></iframe>
    </div>

    <!-- Grid automatically filled by JavaScript -->
    <div class="game-grid" id="grid">Loading games...</div>

    <script>
        // Connect directly to GitHub's public API to scan your specific repository folders
        const repoUser = "aneeshkadam";
        const repoName = "3kh0-assets";

        async function loadArcade() {
            try {
                const response = await fetch(`https://github.com{repoUser}/${repoName}/contents/`);
                const items = await response.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = ''; // Clear loading message

                // Filters folders out from files (like README/License)
                const folders = items.filter(item => item.type === 'dir' && !item.name.startsWith('.'));

                folders.forEach(folder => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    // Cleans up hyphens in names for cleaner display titles
                    card.innerText = folder.name.replace(/-/g, ' '); 
                    card.onclick = () => playGame(folder.name);
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('grid').innerText = "Error loading arcade feed.";
                console.error(error);
            }
        }

        function playGame(folderName) {
            document.getElementById('player').src = `${folderName}/index.html`;
            document.getElementById('theater').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeGame() {
            document.getElementById('theater').style.display = 'none';
            document.getElementById('player').src = '';
        }

        // Run the script on startup
        loadArcade();
    </script>
</body>
</html>
